# ---------------------------------------------------------------------------
# HAPI FHIR JPA-server.
#
# Det kliniske lageret. HAPI har ingen tilgangskontroll som kjenner norske krav
# til tjenstlig behov, sperring og nødrett - derfor er den bare tilgjengelig
# innenfra klyngen, og eneste vei inn er /fhir-fasaden i `epj`, som håndhever
# tilgang og skriver sikkerhetslogg for hvert kall.
#
# Ingen Ingress. Ingen NodePort. Nettverkspolicyen i 10-nettverk.yaml slipper
# bare `epj` inn hit.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: hapi
  namespace: epj
spec:
  type: ClusterIP
  selector:
    app: hapi
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# ---------------------------------------------------------------------------
# HAPI-konfigurasjon som fil, ikke som miljøvariabler.
#
# Dette er ikke en stilpreferanse. HAPI sine egne nøkler har understrek i
# navnet - `fhir_version`, `tenant_identification_strategy`,
# `allow_references_across_partitions` - og dialekten ligger under en nøkkel som
# har punktum i seg: `spring.jpa.properties` er et *kart*, og oppføringen der
# heter bokstavelig `hibernate.dialect`.
#
# Spring oversetter understrek til punktum når det binder miljøvariabler.
# `HAPI_FHIR_TENANT_IDENTIFICATION_STRATEGY` blir dermed
# `hapi.fhir.tenant.identification.strategy`, som ingen leser. Verdien
# forsvinner uten et eneste varsel, og HAPI kjører videre med standardverdien.
#
# Målt mot hapiproject/hapi:v8.0.0 ga det:
#
#   * dialekten falt tilbake til H2, og skjemaet ble bygget med `clob`- og
#     `blob`-kolonner PostgreSQL avviste - serveren startet, og feilet først
#     på første søk med «relation hfj_resource does not exist»
#   * partisjoneringen ble aldri slått på, og /fhir/<virksomhet>/ svarte 404
#     «Unknown resource type» - altså ingen virksomhetsavgrensning i det
#     kliniske lageret i det hele tatt
#
# `SPRING_APPLICATION_JSON` med flate nøkler er ikke nok: dialekten endte da på
# Hibernates automatisk oppdagede `PostgreSQLDialect`, ikke HAPI sin. En fil med
# riktig nøsting er den eneste formen som treffer, og
# `spring.config.additional-location` har høyere presedens enn konfigurasjonen
# i bildet.
#
# Legger du til noe her: kontroller etterpå at /fhir/<virksomhet>/metadata
# svarer 200, ikke 404.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: hapi-konfigurasjon
  namespace: epj
data:
  application.yaml: |
    spring:
      jpa:
        properties:
          hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
          hibernate.search.enabled: false
    hapi:
      fhir:
        # R5 er datamodellen for hele journalen.
        fhir_version: R5
        server_address: http://hapi:8080/fhir

        # --- Multitenancy -------------------------------------------------
        # Hver virksomhet har sin egen partisjon, og partisjonsnavnet inngår i
        # FHIR-URL-en: /fhir/<virksomhet>/Patient/123.
        tenant_identification_strategy: URL_BASED
        partitioning:
          # Dette er det som gjør at en ressurs i én virksomhet ikke kan peke
          # inn i en annen - heller ikke ved en feil i vår egen kode.
          allow_references_across_partitions: false
          partitioning_include_in_search_hashes: false
          conditional_create_duplicate_identifiers_enabled: false

        allow_multiple_delete: true
        allow_external_references: true
        allow_placeholder_references: true
        allow_cascading_deletes: false
        enforce_referential_integrity_on_write: false
        enforce_referential_integrity_on_delete: false
        default_page_size: 50
        max_page_size: 200
        # HAPI nås aldri av en nettleser. Ingen CORS-opprinnelser.
        cors:
          allow_Credentials: false
          allowed_origin: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi
  namespace: epj
spec:
  # HAPI tåler flere instanser mot samme database. Start med én, og skaler når
  # du har målt at det er FHIR-laget som er flaskehalsen.
  replicas: 1
  selector:
    matchLabels:
      app: hapi
  # HAPI er én instans mot ett skjema, og bygger skjemaet ved oppstart. En
  # rullerende oppdatering ville kjørt to instanser mot den samme databasen
  # samtidig - to skjemaoppdateringer i parallell - og krevd dobbelt minne av
  # den tyngste komponenten i oppsettet. Vi tar heller nedetiden.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: konfigurasjon
          configMap:
            name: hapi-konfigurasjon
      containers:
        - name: hapi
          image: hapiproject/hapi:v8.0.0
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/hapi
            - name: SPRING_DATASOURCE_USERNAME
              value: epj
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epj-hemmeligheter
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATASOURCE_DRIVERCLASSNAME
              value: org.postgresql.Driver
            # Alt annet står i application.yaml, montert fra ConfigMap-en
            # under. Se merknaden der: HAPI sine nøkler kan ikke uttrykkes som
            # miljøvariabler.
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/hapi/
            - name: JAVA_TOOL_OPTIONS
              value: '-Xmx2g -XX:MaxRAMPercentage=75'
          volumeMounts:
            - name: konfigurasjon
              mountPath: /etc/hapi
              readOnly: true
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /fhir/metadata?_summary=true
              port: 8080
            # Første oppstart oppretter skjemaet og kan ta flere minutter.
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /fhir/metadata?_summary=true
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
