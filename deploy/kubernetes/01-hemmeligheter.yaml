# ---------------------------------------------------------------------------
# Hemmeligheter.
#
# Denne filen er en MAL. Verdiene under er tomme med vilje, og skal ikke fylles
# ut i git. Lag dem i stedet fra kommandolinjen, eller la en hemmelighetstjener
# (External Secrets, Vault, Sealed Secrets) skrive dem inn:
#
#   kubectl -n epj create secret generic epj-hemmeligheter \
#     --from-literal=EPJ_DATA_KEY="$(openssl rand -base64 48)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
#
# EPJ_DATA_KEY krypterer TOTP-hemmeligheter og private signeringsnøkler i
# databasen. Mister du den, må alle brukere sette opp totrinnsverifisering på
# nytt, og alle utstedte tokens må trekkes tilbake. Ta vare på den samme
# steder som du tar vare på sikkerhetskopiene - men ikke sammen med dem.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: epj-hemmeligheter
  namespace: epj
type: Opaque
stringData:
  EPJ_DATA_KEY: ''
  POSTGRES_PASSWORD: ''
  # HelseID: privat nøkkel i PEM, med \n som linjeskift.
  EPJ_HELSEID_PRIVATE_KEY: ''
  # Delt hemmelighet mot HAPI, hvis HAPI kjører med Basic-autentisering.
  EPJ_HAPI_PASSWORD: ''
