# ---------------------------------------------------------------------------
# Configuration for this environment. Merged with 02-konfigurasjon.yaml.
#
# This is a reference installation on epj.apps.apus.no, not a clinical
# production environment. Two of the values below deliberately differ from the
# base setup, and both must be turned round before the system sees real patient
# data:
#
#   EPJ_TEST_LOGIN         username and password alongside HelseID
#   EPJ_INTEGRATION_MODE   SFM, NHN and Helfo answer locally, not in NHN
#
# See docs/apne-punkter.md.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: epj-konfigurasjon
  namespace: epj
data:
  EPJ_BASE_URL: https://epj.apps.apus.no

  # One organisation, one hostname. The default organisation has no hostname
  # registered, so the lookup must be allowed to fall back on it. Set to
  # `false`, the record answers 404 to everything until the hostname is
  # registered from platform administration.
  EPJ_ALLOW_UNKNOWN_HOSTNAME: 'true'
  # Empty: platform administration has no hostname of its own here, so
  # /systemadmin is not exposed. Give it a name under *.apps.apus.no to turn
  # it on.
  EPJ_PLATFORM_HOSTNAME: ''

  # CloudNativePG signs the server certificate with the cluster's own CA.
  EPJ_DB_SSL: 'true'
  NODE_EXTRA_CA_CERTS: /etc/epj/postgres-ca/ca.crt

  EPJ_TEST_LOGIN: 'true'
  EPJ_SHOW_DEMO_USERS: 'true'

  # HelseID against NHN's test environment. The key lives in
  # `epj-hemmeligheter`, never in git. `kid` is the RFC 7638 thumbprint of the
  # public key, and has been checked against the key itself.
  #
  # Off until the public key is registered against the client in NHN
  # Selvbetjening: the client id is recognised (a plain /connect/authorize call
  # answers 'Pushed authorization is required', not 'Unknown client'), but the
  # client assertion is rejected with invalid_client at both /connect/par and
  # /connect/token, for every combination of alg, aud and kid. That is HelseID
  # saying it holds a different public key for this client.
  EPJ_HELSEID_ENABLED: 'false'
  EPJ_HELSEID_CLIENT_ID: 5179bc26-7699-4c36-8428-32cb7f06efe1
  EPJ_HELSEID_ISSUER: https://helseid-sts.test.nhn.no
  EPJ_HELSEID_KEY_ID: oUMPVNSLU4Xj5LiEJ_X1vzVZF5iLM5C1GqUYAMlEs9U
  EPJ_HELSEID_ALG: PS256
  EPJ_HELSEID_REDIRECT_URI: https://epj.apps.apus.no/logg-inn/helseid/tilbake
  EPJ_INTEGRATION_MODE: mock

  EPJ_ORG_NAME: Storgata Legesenter
  EPJ_ORG_NUMBER: '999999999'
  EPJ_ORG_HER_ID: '8000001'
  EPJ_ORG_MUNICIPALITY_CODE: '0301'
