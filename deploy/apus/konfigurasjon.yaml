# ---------------------------------------------------------------------------
# Configuration for this environment. Merged with 02-konfigurasjon.yaml.
#
# This is a reference installation on epj.apps.apus.no, not a clinical
# production environment. Two of the values below deliberately differ from the
# base setup, and both must be turned round before the system sees real patient
# data:
#
#   EPJ_TEST_LOGIN         username and password alongside HelseID
#   EPJ_INTEGRATION_MODE   SFM, NHN and Helfo answer locally, not in NHN
#
# See docs/apne-punkter.md.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: epj-konfigurasjon
  namespace: epj
data:
  EPJ_BASE_URL: https://epj.apps.apus.no

  # One organisation, one hostname. The default organisation has no hostname
  # registered, so the lookup must be allowed to fall back on it. Set to
  # `false`, the record answers 404 to everything until the hostname is
  # registered from platform administration.
  EPJ_ALLOW_UNKNOWN_HOSTNAME: 'true'
  # Platform administration has its own hostname. /systemadmin exists only
  # there, and the practice's own name never exposes it.
  EPJ_PLATFORM_HOSTNAME: epj-admin.apps.apus.no

  # The developer portal has a hostname of its own, and only the portal is on
  # it. A developer account holds no role and no organisation - keeping it on
  # a separate origin means there is no path from one into the other.
  EPJ_DEVELOPER_HOSTNAME: utvikler.apps.apus.no

  # Trial organisations share one hostname. They have no address each: which
  # organisation a request belongs to follows from who is signed in, and a
  # signed-out visitor here gets the front page and the sign-up form.
  EPJ_PROVE_VERTSNAVN: prov.apps.apus.no
  EPJ_PROVEKONTO: 'true'
  # Sign-in by emailed code. Weaker than HelseID, and meant for trials with
  # synthetic data - which is what this installation is.
  EPJ_EPOST_INNLOGGING: 'true'

  # Sign-in codes for the portal. The key lives in `epj-hemmeligheter`.
  EPJ_SMTP_HOST: smtp-relay.brevo.com
  EPJ_SMTP_PORT: '587'
  # Brevo's SMTP login is a generated one, not the sender address. The sender
  # below is the verified address the mail goes out as.
  EPJ_SMTP_USER: ae59ac001@smtp-brevo.com
  EPJ_SMTP_FROM: lars@roland.bz
  EPJ_SMTP_FROM_NAME: EPJ utviklerportal

  # CloudNativePG signs the server certificate with the cluster's own CA.
  EPJ_DB_SSL: 'true'
  NODE_EXTRA_CA_CERTS: /etc/epj/postgres-ca/ca.crt

  EPJ_TEST_LOGIN: 'true'
  EPJ_SHOW_DEMO_USERS: 'true'

  # HelseID against NHN's test environment. The key lives in
  # `epj-hemmeligheter`, never in git. `kid` is the RFC 7638 thumbprint of the
  # public key, and has been checked against the key itself.
  #
  # This is a test client at NHN. Test sign-in stays on alongside it, so the
  # demo users still work if HelseID is unavailable.
  EPJ_HELSEID_ENABLED: 'true'
  EPJ_HELSEID_CLIENT_ID: 5179bc26-7699-4c36-8428-32cb7f06efe1
  EPJ_HELSEID_ISSUER: https://helseid-sts.test.nhn.no
  EPJ_HELSEID_KEY_ID: oUMPVNSLU4Xj5LiEJ_X1vzVZF5iLM5C1GqUYAMlEs9U
  EPJ_HELSEID_ALG: PS256
  # No fixed redirect URI. The callback has to sit on the hostname the sign-in
  # started from, because that is where the session cookie is set and which
  # organisation the request resolves to. Pinning it to one hostname sent a
  # sign-in at epj-admin back to the practice, where the platform
  # administrator's account does not exist. Both callbacks must be registered
  # in HelseID:
  #   https://epj.apps.apus.no/logg-inn/helseid/tilbake
  #   https://epj-admin.apps.apus.no/logg-inn/helseid/tilbake
  EPJ_INTEGRATION_MODE: mock

  EPJ_ORG_NAME: Storgata Legesenter
  EPJ_ORG_NUMBER: '999999999'
  EPJ_ORG_HER_ID: '8000001'
  EPJ_ORG_MUNICIPALITY_CODE: '0301'
