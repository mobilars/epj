<!doctype html>
<html lang="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Vekstkurve</title>
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body>
		<main id="app"><p class="svak">Kobler til journalen …</p></main>

		<script type="module">
			/**
			 * Vekstkurve.
			 *
			 * A child's height and weight over time, with a way to add a new
			 * measurement, which is saved in the record like any other.
			 *
			 * There are deliberately no percentile curves. They have to come from a
			 * published table, and a curve typed in from memory would look exactly as
			 * trustworthy as a real one. A real version would use the Norwegian growth
			 * charts.
			 */
			import { connect, escapeHtml as esc, SmartError } from '/smart.js';
			import { latest, lineChart, series } from '/chart.js';
			import { exampleObservation, mountExampleControls } from '/example-data.js';

			const HEIGHT = '8302-2';
			const WEIGHT = '29463-7';

			// Round numbers by year of age, to give the chart something to draw. Invented,
			// and not a reference for anything.
			const EXAMPLE_HEIGHT = [50, 75, 87, 95, 102, 109, 115, 121, 127, 133, 138, 144, 150, 157, 163, 167, 170, 172, 173];
			const EXAMPLE_WEIGHT = [3.5, 10, 12.5, 14.5, 16.5, 18.5, 21, 23.5, 26, 29, 32, 36, 41, 47, 53, 58, 62, 65, 67];

			const SCOPE =
				'openid fhirUser launch launch/patient online_access ' +
				'patient/Patient.rs patient/Observation.rs patient/Observation.cu';

			const app = document.getElementById('app');
			const el = (html) => (app.innerHTML = html);

			let smart;
			try {
				smart = await connect({ scope: SCOPE });
			} catch (err) {
				el(`<div class="varsel varsel-feil"><strong>${esc(err.message)}</strong>
					<pre>${esc(err instanceof SmartError ? err.detail : String(err))}</pre></div>`);
				throw err;
			}

			if (smart === null) {
				el(`<h1>Vekstkurve</h1><p class="svak">Startes fra journalen.</p>`);
			} else {
				await render();
			}

			function ageText(birthDate) {
				if (!birthDate) return '';
				const months = Math.floor((Date.now() - new Date(birthDate).getTime()) / (30.4375 * 86400000));
				return months < 24 ? `${months} måneder` : `${Math.floor(months / 12)} år`;
			}

			function examplesFor(birthDate) {
				if (!birthDate) return [];
				const born = new Date(birthDate);
				const age = Math.floor((Date.now() - born.getTime()) / (365.25 * 86400000));
				const out = [];
				for (let year = 0; year <= Math.min(age, 18); year++) {
					const date = new Date(born);
					date.setFullYear(born.getFullYear() + year);
					const when = date.toISOString();
					out.push(
						exampleObservation(smart.patientId, { code: HEIGHT, display: 'Høyde', unit: 'cm', value: EXAMPLE_HEIGHT[year], when }),
						exampleObservation(smart.patientId, { code: WEIGHT, display: 'Vekt', unit: 'kg', value: EXAMPLE_WEIGHT[year], when })
					);
				}
				return out;
			}

			async function render(notice = '') {
				const id = smart.patientId;
				const [patient, observations] = await Promise.all([
					smart.read(`Patient/${id}`),
					smart.read(`Observation?patient=${id}&_count=200`)
				]);
				const measured = smart.entries(observations);
				const heights = series(measured, [HEIGHT]);
				const weights = series(measured, [WEIGHT]);
				const [h, w] = [latest(heights), latest(weights)];
				const bmi = h && w && h.value > 0 ? w.value / (h.value / 100) ** 2 : null;
				const canWrite = smart.scopes.includes('patient/Observation.cu');

				el(`
					<div class="mellom">
						<h1>Vekstkurve</h1>
						<span class="merke">Demonstrasjon</span>
					</div>
					<p class="svak">${esc(ageText(patient.body?.birthDate))}${bmi ? ` · KMI ${bmi.toFixed(1)}` : ''}</p>
					${notice}
					<h2>Høyde</h2>
					${lineChart(heights, { label: 'Høyde' })}
					<h2>Vekt</h2>
					${lineChart(weights, { label: 'Vekt' })}
					${
						canWrite
							? `<h2>Ny måling</h2>
								<form id="ny" class="rad">
									<label>Høyde (cm) <input name="hoyde" type="number" step="0.1" min="30" max="230" /></label>
									<label>Vekt (kg) <input name="vekt" type="number" step="0.1" min="1" max="300" /></label>
									<button type="submit">Lagre i journalen</button>
								</form>`
							: '<p class="svak liten">Appen har ikke fått lov til å lagre målinger.</p>'
					}
					<div id="eksempel"></div>
					<p class="svak liten" style="margin-top:0.8rem">
						Demonstrasjonsapp, ikke til klinisk bruk. Uten persentilkurver, som må hentes fra de norske vekstkurvene.
					</p>
				`);

				mountExampleControls(document.getElementById('eksempel'), {
					smart,
					resources: measured,
					examples: () => examplesFor(patient.body?.birthDate),
					onChange: () => render()
				});

				document.getElementById('ny')?.addEventListener('submit', async (event) => {
					event.preventDefault();
					const form = new FormData(event.target);
					const entries = [
						[HEIGHT, 'Høyde', 'cm', form.get('hoyde')],
						[WEIGHT, 'Vekt', 'kg', form.get('vekt')]
					].filter(([, , , value]) => value);
					if (!entries.length) return;
					const results = await Promise.all(
						entries.map(([code, display, unit, value]) =>
							smart.create({
								resourceType: 'Observation',
								status: 'final',
								category: [{ coding: [{ system: 'http://terminology.hl7.org/CodeSystem/observation-category', code: 'vital-signs' }] }],
								code: { coding: [{ system: 'http://loinc.org', code, display }], text: display },
								subject: { reference: `Patient/${id}` },
								effectiveDateTime: new Date().toISOString(),
								valueQuantity: { value: Number(value), unit, system: 'http://unitsofmeasure.org', code: unit }
							})
						)
					);
					const failed = results.find((r) => !r.ok);
					await render(
						failed
							? `<div class="varsel varsel-feil">Journalen avviste målingen (${esc(failed.status)}).</div>`
							: '<div class="varsel varsel-ok">Lagret i journalen.</div>'
					);
				});
			}
		</script>
	</body>
</html>
