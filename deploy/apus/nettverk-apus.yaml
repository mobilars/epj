# ---------------------------------------------------------------------------
# Tillegg til nettverkspolicyene i 10-nettverk.yaml, for dette miljøet.
#
# Policyer er additive: reglene her utvider grunnoppsettet, de svekker det
# ikke. To ting skiller klyngen vår fra malen:
#
#   1. Inngangskontrolleren ligger i navnerommet `ingress`, ikke `ingress-nginx`.
#   2. Databasen driftes av en operatør. Instansene må nå API-tjeneren, og
#      operatøren må nå instansene - trafikk `standard-nekt` ellers stenger,
#      med den følgen at klyngen aldri blir klar.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: epj-fra-ingress
  namespace: epj
spec:
  podSelector:
    matchLabels:
      app: epj
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-operator
  namespace: epj
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress, Egress]
  ingress:
    # Operatøren leser status fra instansforvalteren.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
    # Replikering mellom instansene i klyngen.
    - from:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
  egress:
    # Instansforvalteren følger med på sin egen Cluster-ressurs, og må derfor
    # nå API-tjeneren. microk8s lytter på 16443 på nodene selv; policyen
    # vurderes etter at tjenesteadressen er oversatt til nodeadressen.
    - to:
        - ipBlock:
            cidr: 192.168.50.0/24
      ports:
        - port: 16443
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
---
# Demodatajobben trenger de samme veiene ut som journalen selv - databasen, HAPI
# og DNS - men skal ikke ha journalens merkelapp, siden tjenesten `epj` velger
# den. Den får derfor sin egen regel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: epj-seed
  namespace: epj
spec:
  podSelector:
    matchLabels:
      app: epj-seed
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: hapi
      ports:
        - port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Nettverkspolicy virker i begge ender: det holder ikke at jobben har lov til å
# gå ut, databasen og HAPI må også ha lov til å slippe den inn. Reglene i
# 10-nettverk.yaml kjenner bare `app: epj` og `app: hapi`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-fra-seed
  namespace: epj
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: epj-seed
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hapi-fra-seed
  namespace: epj
spec:
  podSelector:
    matchLabels:
      app: hapi
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: epj-seed
      ports:
        - port: 8080
---
# cert-manager løser ACME HTTP-01 med en egen pod i dette navnerommet. Den
# bærer ikke journalens merkelapper, så `standard-nekt` stenger den ute, og
# utfordringen svarer aldri - fornyelse av sertifikatet stopper opp uten at noe
# annet ser galt ut. Regelen her slipper inngangskontrolleren inn til den.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver
  namespace: epj
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: 'true'
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
