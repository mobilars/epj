# ---------------------------------------------------------------------------
# The SMART apps, each on a hostname of its own.
#
# Separate origins on purpose. A SMART app is a third party even when we wrote
# it, and everything that makes one safe to embed rests on it being somewhere
# else: its own origin, its own storage, no cookies of the record's. Putting
# them on paths under one host would make them one app wearing four hats.
#
# One nginx serves them all, choosing the file by server name. They are static
# pages - a public client has nowhere to keep a secret, so there is no server
# side to any of them.
#
#   smartdemo.apps.apus.no    the technical test app
#   notat.apps.apus.no        the note editor
#   kritisk.apps.apus.no      critical information
#   legemidler.apps.apus.no   the medication list
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: demoapp-nginx
  namespace: epj
data:
  default.conf: |
    # try_files resolves its fallback as a URI under root, not as a path on
    # disk. An absolute path here sends nginx round in a redirect loop.
    map $host $appfil {
      default                 /index.html;
      notat.apps.apus.no      /notat.html;
      kritisk.apps.apus.no    /kritisk.html;
      legemidler.apps.apus.no /legemidler.html;
    }

    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;

      # The record frames these apps, and says so here. The record's own
      # frame-ancestors stays 'none' - this is each app allowing the record,
      # not the other way round.
      add_header Content-Security-Policy "frame-ancestors https://epj.apps.apus.no https://epj-admin.apps.apus.no" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;

      # Shared files keep their own names.
      location = /smart.js { try_files /smart.js =404; }
      location = /app.css  { try_files /app.css =404; }

      # /launch and /callback are states of the same page, not separate files.
      # Which page depends on the hostname.
      location / {
        try_files $uri $appfil =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: epj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 96Mi }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html }
            - { name: konfigurasjon, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /tmp }
      volumes:
        - name: html
          configMap:
            name: demoapp-html
        - name: konfigurasjon
          configMap:
            name: demoapp-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demoapp
  namespace: epj
spec:
  selector:
    app: demoapp
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demoapp
  namespace: epj
spec:
  podSelector:
    matchLabels:
      app: demoapp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 8080
  # Serves files and nothing else. The browser talks to the record; this pod
  # talks to no one.
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demoapp
  namespace: epj
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: public
  tls:
    - hosts:
        - smartdemo.apps.apus.no
        - notat.apps.apus.no
        - kritisk.apps.apus.no
        - legemidler.apps.apus.no
      secretName: demoapp-tls
  rules:
    - host: smartdemo.apps.apus.no
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: demoapp, port: { number: 80 } } } }
    - host: notat.apps.apus.no
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: demoapp, port: { number: 80 } } } }
    - host: kritisk.apps.apus.no
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: demoapp, port: { number: 80 } } } }
    - host: legemidler.apps.apus.no
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: demoapp, port: { number: 80 } } } }
