# Tre ting skiller HAPI her fra malen:
#
#   1. Databasen ligger i operatørens klynge. JDBC-driveren forhandler TLS av
#      seg selv (`sslmode=prefer`), så den trenger ingen CA montert.
#   2. Partisjonering og dialekt settes med SPRING_APPLICATION_JSON. Se
#      merknaden i 04-hapi.yaml: nøklene inneholder understrek og punktum som
#      en miljøvariabel ikke kan uttrykke.
#   3. Nodene her har under 4 GB hver. Malens 2 GB forespurt og 3 GB tak er
#      mer enn klyngen tåler ved siden av alt annet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi
  namespace: epj
spec:
  template:
    spec:
      containers:
        - name: hapi
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-rw:5432/hapi
            - name: JAVA_TOOL_OPTIONS
              value: '-Xmx1g -XX:MaxMetaspaceSize=320m'
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
