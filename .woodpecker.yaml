# ---------------------------------------------------------------------------
# Kontinuerlig integrasjon.
#
# Kjører på Woodpecker med Kubernetes-motoren. Hvert steg er en pod i
# navnerommet `woodpecker`, og arbeidsmappen er et volum som følger med gjennom
# hele kjøringen.
#
# CI bygger *ikke* containerbildet. Klyngen har tre noder på under 4 GB, og de
# kjører også det denne CI-en skal teste. Et kaniko-bygg av dette prosjektet
# trenger rundt 3,5 GB alene, og et byggetrinn som spiser opp noden det kjører
# på gjør mer skade enn den tiden det sparer. Bildet bygges og publiseres
# manuelt med `deploy/apus/bygg.sh`, som kjører byggejobben ferdig og rydder
# etter seg.
#
# One step: install, type check, build. That is what breaks most often and
# what a push should not be allowed to break, and it takes a couple of minutes.
#
# Tests are run by hand, not here:
#
#   npm test                 unit tests. The ones that need a database run only
#                            when EPJ_TEST_DATABASE_URL points at a PostgreSQL
#                            they may create and drop databases in.
#   npx playwright test      browser tests, against a local server.
#
# They were taken out because the cluster cannot carry them. The Playwright
# image is close to 1 GB to download; pulled onto a node with a 15 GB disk it
# took the node under its eviction threshold and the container registry down
# with it. The database tests took close to five minutes on their own.
#
# Alle steg har tak på minne og CPU. Uten tak er det ingenting som hindrer et
# byggetrinn i å ta ned noden - og med den resten av klyngen.
# ---------------------------------------------------------------------------
when:
  - event: [push, pull_request, manual]

variables:
  - &node node:22-alpine
  # Felles miljø for testkjøringene. Nøkkelen er en testnøkkel og skal være det.
  - &test_env
    EPJ_DATA_KEY: ci-nokkel-kun-for-testkjoring-000000000
    EPJ_ORG_HER_ID: '8000001'
    EPJ_ORG_NUMBER: '994598759'
    EPJ_INTEGRATION_MODE: mock
    # Nettleserne til Playwright lastes bare ned der de faktisk brukes.
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  - &lite_tak
    kubernetes:
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: '1', memory: 1536Mi}

steps:
  check:
    image: *node
    environment: *test_env
    backend_options: *lite_tak
    commands:
      - npm ci
      - npm run check
      - npm run build

  varsle-e-post:
    image: drillster/drone-email
    settings:
      host: smtp-relay.brevo.com
      port: 587
      username: ae59ac001@smtp-brevo.com
      password:
        from_secret: brevo_smtp_key
      from: lars@roland.bz
      recipients:
        - lars@roland.bz
      recipients_only: true
      subject: '[${CI_PIPELINE_STATUS}] ${CI_REPO} bygg #${CI_PIPELINE_NUMBER}'
    when:
      - status: [failure]
