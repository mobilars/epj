# ---------------------------------------------------------------------------
# Kontinuerlig integrasjon.
#
# Kjører på Woodpecker med Kubernetes-motoren. Hvert steg er en pod i
# navnerommet `woodpecker`, og arbeidsmappen er et volum som følger med gjennom
# hele kjøringen.
#
# CI bygger *ikke* containerbildet. Klyngen har tre noder på under 4 GB, og de
# kjører også det denne CI-en skal teste. Et kaniko-bygg av dette prosjektet
# trenger rundt 3,5 GB alene, og et byggetrinn som spiser opp noden det kjører
# på gjør mer skade enn den tiden det sparer. Bildet bygges og publiseres
# manuelt med `deploy/apus/bygg.sh`, som kjører byggejobben ferdig og rydder
# etter seg.
#
# Rekkefølgen er valgt slik at det som feiler oftest, feiler først: typene, så
# enhetstestene, så nettleseren.
#
# Alle steg har tak på minne og CPU. Uten tak er det ingenting som hindrer et
# byggetrinn i å ta ned noden - og med den resten av klyngen.
# ---------------------------------------------------------------------------
when:
  - event: [push, pull_request, manual]

variables:
  - &node node:22-alpine
  # Felles miljø for testkjøringene. Nøkkelen er en testnøkkel og skal være det.
  - &test_env
    EPJ_DATA_KEY: ci-nokkel-kun-for-testkjoring-000000000
    EPJ_ORG_HER_ID: '8000001'
    EPJ_ORG_ORGNR: '994598759'
    EPJ_INTEGRASJON_MODUS: mock
    # Nettleserne til Playwright lastes bare ned der de faktisk brukes.
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  - &lite_tak
    kubernetes:
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: '1', memory: 1536Mi}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epj
      POSTGRES_PASSWORD: epj
      POSTGRES_DB: epj
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}

steps:
  typekontroll:
    image: *node
    environment: *test_env
    backend_options: *lite_tak
    commands:
      - npm ci
      - npm run check
      - npm run build

  enhetstester:
    image: *node
    environment:
      <<: *test_env
      EPJ_TEST_DATABASE_URL: postgres://epj:epj@postgres:5432/postgres
    backend_options: *lite_tak
    commands:
      - npm ci
      - until nc -z postgres 5432; do sleep 1; done
      - npm test

  ende-til-ende:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    environment:
      <<: *test_env
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      EPJ_BASE_URL: http://127.0.0.1:4173
      E2E_DATABASE_URL: postgres://epj:epj@postgres:5432/epj_e2e
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: '1', memory: 2Gi}
    commands:
      - npm ci
      - until nc -z postgres 5432; do sleep 1; done
      - npx playwright test

  varsle-e-post:
    image: drillster/drone-email
    settings:
      host: smtp-relay.brevo.com
      port: 587
      username: ae59ac001@smtp-brevo.com
      password:
        from_secret: brevo_smtp_key
      from: lars@roland.bz
      recipients:
        - lars@roland.bz
      recipients_only: true
      subject: '[${CI_PIPELINE_STATUS}] ${CI_REPO} bygg #${CI_PIPELINE_NUMBER}'
    when:
      - status: [failure]
