name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  EPJ_DATA_KEY: ci-nokkel-kun-for-testkjoring-000000000
  EPJ_BASE_URL: http://127.0.0.1:4173
  EPJ_ORG_HER_ID: '8000001'
  EPJ_ORG_ORGNR: '994598759'
  EPJ_INTEGRASJON_MODUS: mock

jobs:
  kontroll:
    name: Typekontroll og bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  enhetstester:
    name: Enhets- og integrasjonstester
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epj
          POSTGRES_PASSWORD: epj
          POSTGRES_DB: epj
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U epj"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          EPJ_TEST_DATABASE_URL: postgres://epj:epj@127.0.0.1:5432/postgres

  ende-til-ende:
    name: Ende-til-ende
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epj
          POSTGRES_PASSWORD: epj
          POSTGRES_DB: epj
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U epj"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://epj:epj@127.0.0.1:5432/epj_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-rapport
          path: playwright-report/
          retention-days: 7

  integrasjon-hapi:
    name: Integrasjon mot ekte HAPI FHIR
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epj
          POSTGRES_PASSWORD: epj
          POSTGRES_DB: epj
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U epj"
          --health-interval 5s --health-timeout 5s --health-retries 20
      hapi:
        image: hapiproject/hapi:v8.0.0
        env:
          # H2 i minnet holder for kontrakttesting og starter raskere.
          HAPI_FHIR_FHIR_VERSION: R5
          HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: 'true'
          HAPI_FHIR_ALLOW_PLACEHOLDER_REFERENCES: 'true'
          HAPI_FHIR_ENFORCE_REFERENTIAL_INTEGRITY_ON_WRITE: 'false'
          SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: 'false'
        ports: ['8080:8080']
        options: >-
          --health-cmd "curl -sf http://localhost:8080/fhir/metadata?_summary=true || exit 1"
          --health-interval 20s --health-timeout 10s --health-retries 30
          --health-start-period 150s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vent på HAPI
        run: |
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:8080/fhir/metadata?_summary=true" > /dev/null && exit 0
            sleep 5
          done
          echo "HAPI startet ikke" && exit 1
      - name: Kjør migrasjoner og demodata mot ekte HAPI
        run: npm run migrer && npm run seed
        env:
          EPJ_DATABASE_URL: postgres://epj:epj@127.0.0.1:5432/epj
          EPJ_HAPI_BASE_URL: http://127.0.0.1:8080/fhir
      - name: Integrasjonstester mot ekte HAPI
        run: npx vitest run tests/gateway.test.ts tests/integrasjoner.test.ts
        env:
          EPJ_TEST_DATABASE_URL: postgres://epj:epj@127.0.0.1:5432/postgres
          EPJ_BRUK_EKTE_HAPI: '1'
          EPJ_HAPI_BASE_URL: http://127.0.0.1:8080/fhir
